server:
  port: 9084
  error:
    include-stacktrace: never

spring:

  application:
    name: job-service


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5InnoDBDialect

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
    initialize: true


eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  fetch-registry: true
  instance:
    prefer-ip-address: true
#    instance-id: ${EUREKA_INSTANCE_IP}:${spring.application.name}:${server.port}
#    ip-address: ${EUREKA_INSTANCE_IP:${spring.cloud.client.ip-address}}


#JWT token, token validity in seconds
jwt:
  access:
    token:
      validity: 7776000
  refresh:
    token:
      validity: 7776000
  secret: fsm



forgot.password.time.in.second: 60
forgot.password.otp.resend.count: 3
user.activation.link.url: ${USER_ACTIVATION_LINK_URL}
user.forget.password.link: ${USER_FORGET_PASSWORD_LINK_URL}
client.feedback.link: ${CLIENT_FEEDBACK_LINK_URL}

feign:
  client:
    config:
      default:
        connectTimeout: 10000     # 10 seconds
        readTimeout: 30000        # 30 seconds


randomPassword: Octal@123
springdoc:
  api-docs.path: /api-docs
  swagger-ui.path: /swagger-ui.html

